[package]
name = "klyro-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "The Klyro daemon: the always-on process that owns the hot path."
license = "MIT"

[[bin]]
name = "klyro-core"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-core = "0.3"
futures-util = "0.3"
bytes = "1"
getrandom = "0.2"


[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
