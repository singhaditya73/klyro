appId: com.klyro.app
productName: Klyro
copyright: Copyright © 2026 Aditya Singh
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - '!**/*.map'
  # Keep only what runs: no type declarations, tests, examples or benchmarks.
  #
  # Do NOT exclude `src`, `doc` or `docs` here. They look like source and
  # documentation, but some packages ship runtime code in them and point
  # `main` at it:
  #   - yaml keeps runtime modules in `dist/doc/` (compose/composer.js requires
  #     ../doc/directives.js) — excluding `doc` made the 0.9.23 Windows build
  #     crash on launch with "Cannot find module '../doc/directives.js'";
  #   - debug, keyv, cacheable-request, clone-response, responselike,
  #     real-require and sprintf-js have `main: src/index.js`.
  # The few megabytes are not worth an app that will not start.
  - '!node_modules/**/*.{d.ts,d.cts,d.mts}'
  - '!node_modules/**/{test,tests,__tests__,example,examples,benchmark,benchmarks}/**'
  - '!node_modules/**/{.eslintrc*,.prettierrc*,tsconfig*.json,readme*,README*,changelog*,CHANGELOG*}'
  # The MCP SDK ships an ESM copy and a server half with its own HTTP stack
  # that Klyro never loads: Klyro is a protocol *client* on CommonJS. The
  # SDK's server folder stays (the client imports a shared helper from it),
  # but its Express/Hono stack does not ship.
  - '!node_modules/@modelcontextprotocol/sdk/dist/esm/**'
  - '!node_modules/{express,raw-body,jose,cors,@hono}/**'
  # Prune unused onnxruntime native binaries (Darwin, ARM64, and heavy 260MB+ CUDA/TensorRT GPU blobs)
  - '!node_modules/onnxruntime-node/bin/napi-v6/darwin/**'
  - '!node_modules/onnxruntime-node/bin/napi-v6/**/arm64/**'
  - '!node_modules/onnxruntime-node/bin/napi-v6/**/libonnxruntime_providers_cuda.so'
  - '!node_modules/onnxruntime-node/bin/napi-v6/**/libonnxruntime_providers_tensorrt.so'
  - '!node_modules/onnxruntime-node/bin/napi-v6/**/onnxruntime_providers_cuda.dll'
  - '!node_modules/onnxruntime-node/bin/napi-v6/**/onnxruntime_providers_tensorrt.dll'
  - '!node_modules/**/*.map'
  - '!node_modules/@techstark/opencv-js/src/**'
asar: true
# Native code cannot be loaded from inside an asar archive. electron-builder
# unpacks the `.node` files it detects, but sharp's image library (libvips)
# ships as a plain .so/.dylib/.dll in a sibling package (@img/sharp-libvips-*),
# which it does not detect. Without this, RapidOCR fails to initialise with
# "Could not load the sharp module ... libvips-cpp.so: cannot open shared
# object file" — caught at runtime, so OCR silently stayed off.
asarUnpack:
  - '**/*.node'
  - 'node_modules/@img/**'
# The daemon: one small Rust binary next to the app. It owns the hot path, so
# the overlay opens in milliseconds instead of waiting on a browser runtime.
extraResources:
  - from: crates/klyro-core/target/release
    to: .
    filter:
      - 'klyro-core*'
  - from: resources/models/whisper
    to: models/whisper
    filter:
      - '*.bin'
  - from: resources/models/ocr
    to: models/ocr
    filter:
      - '*.onnx'
      - '*.txt'
compression: maximum
artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  target:
    - AppImage
    - deb
  category: Utility
  icon: build/icon.png
  synopsis: Klyro — Your AI. Your entire computer.
  syncDesktopName: true
  description: >-
    Klyro is a local-first AI desktop assistant. It can see your screen, hear
    your voice, remember what matters, search your documents and code, and act
    on your computer. Bring your own model provider — cloud or fully local.

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0

win:
  target:
    - nsis
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Klyro

mac:
  target:
    - dmg
  category: public.app-category.productivity
  # Not a supported release target yet (see docs/FEATURE_MATRIX.md).
